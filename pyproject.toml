[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semdrift"
version = "0.1.0"
description = "Detect semantic drift between source code and documentation in Python repositories."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aadhithya T"},
]
keywords = ["semantic-drift", "documentation", "code-quality", "static-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

# Runtime dependencies for Model & Inference (Phase 3)
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Aadhithya-T/SemDrift"
Repository = "https://github.com/Aadhithya-T/SemDrift"

[tool.hatch.build.targets.wheel]
packages = ["src/semdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
